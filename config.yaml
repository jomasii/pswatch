normal_threshold: "4000"
max_threshold: "3600"
suspect_floor: "2000"
max_repeats: 5
max_repeat_interval_s: 60
health_after_s: 600
loop_duration_s: 290
loop_interval_s: 45
# Depois de quanto tempo "acima do último alerta" o app considera que a oferta
# mais barata sumiu de vez e volta a poder alertar (evita alerta repetido quando
# a oferta pisca por falta de estoque ou página fora do ar).
rearm_after_s: 1800

# Lojas aceitas (minusculas, sem acento). Edite aqui para mudar a lista.
allowed_stores:
  - amazon
  - mercado livre
  - magazine luiza
  - magalu
  - kabum
  - americanas
  - casas bahia
  - fast shop
  - carrefour

sources:
  # Páginas de produto que listam ofertas por loja. O modelo (disco/digital)
  # vem do título de cada oferta, então uma página pode ter os dois.
  zoom:
    urls:
      - https://www.zoom.com.br/console-de-video-game/console-playstation-5-slim-1tb-sony-4k-hdr
      - https://www.zoom.com.br/console-de-video-game/console-playstation-5-slim-825gb-sony-4k
      - https://www.zoom.com.br/console-de-video-game/pre-venda-console-playstation-5-slim-1-tb-sony-1214a-4k
      - https://www.zoom.com.br/console-de-video-game/console-playstation-5-slim-1-tb-sony-4k
      # combos com jogos
      - https://www.zoom.com.br/console-de-video-game/playstation-5-slim-1tb-bundle-astro-bot-gran-turismo-7
      - https://www.zoom.com.br/console-de-video-game/console-playstation-5-slim-825gb-sony-ps5-edicao-digital-bundle-4k
  buscape:
    urls:
      - https://www.buscape.com.br/console-de-video-game/console-playstation-5-slim-1tb-sony-4k-hdr
      - https://www.buscape.com.br/console-de-video-game/console-playstation-5-slim-825gb-sony-4k
      - https://www.buscape.com.br/console-de-video-game/pre-venda-console-playstation-5-slim-1-tb-sony-1214a-4k
      - https://www.buscape.com.br/console-de-video-game/console-playstation-5-slim-1-tb-sony-4k
      # combos com jogos
      - https://www.buscape.com.br/console-de-video-game/playstation-5-slim-1tb-bundle-astro-bot-gran-turismo-7
      - https://www.buscape.com.br/console-de-video-game/console-playstation-5-slim-825gb-sony-ps5-edicao-digital-bundle-4k
  # Mercado Livre via robô do Apify (cobra por oferta: ~US$ 0,024 por consulta de 20).
  # Só consulta dentro das janelas abaixo (horário de Brasília) e para de vez
  # depois de max_runs consultas, para não passar do crédito grátis de US$ 5.
  mercadolivre:
    enabled: true
    interval_s: 600
    max_items: 20
    max_charge_usd: "0.05"
    max_runs: 160
    windows:
      - {from: "2026-11-25T12:20:00-03:00", until: "2026-11-25T12:40:00-03:00"}  # teste ao vivo
      - {from: "2026-11-27T00:00:00-03:00", until: "2026-11-28T00:00:00-03:00"}  # Black Friday
  coupons:
    urls: {}

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preço do PS5</title>
  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f5f5f7; --line:#d6d6db; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111; --fg:#f0f0f0; --muted:#9a9a9a; --card:#1c1c1e; --line:#333; }
    }
    body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
           font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:900px; margin:0 auto; }
    h1 { font-size:1.4rem; margin:0 0 4px; }
    h2 { font-size:1.1rem; margin:24px 0 8px; }
    p.muted { color:var(--muted); margin:0 0 12px; font-size:.9rem; }
    .card { background:var(--card); border-radius:10px; padding:12px; margin-bottom:12px; }
    table { width:100%; border-collapse:collapse; font-size:.95rem; }
    td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
    td.num, th.num { text-align:right; }
    canvas { width:100%; max-height:320px; }
  </style>
</head>
<body>
<main>
  <h1>Preço do PS5 Slim</h1>
  <p class="muted" id="status">Carregando…</p>
  <section id="models"></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
